<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickEarn Hub</title>

<script src="//libtl.com/sdk.js" data-zone="11557358" data-sdk="show_11557358"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
}

.wrap {
    max-width: 520px;
    margin: auto;
    padding: 20px;
}

.box {
    background: white;
    border-radius: 20px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h1 {
    font-size: 34px;
    margin-top: 0;
    margin-bottom: 15px;
}

.welcome {
    font-size: 19px;
    margin-bottom: 25px;
}

#questionNumber {
    color: #666;
    font-size: 16px;
    margin-bottom: 15px;
}

#question {
    font-size: 22px;
    margin-bottom: 25px;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 15px;
    margin: 7px 0;
    font-size: 18px;
    cursor: pointer;
    background: #6842c7;
    color: white;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

#result {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
    min-height: 28px;
}

#nextBtn {
    display: none;
    background: #222;
}

#scoreBox {
    display: none;
}

.score {
    font-size: 28px;
    font-weight: bold;
    margin: 20px 0;
}

#restartBtn {
    background: #6842c7;
}

.footer {
    text-align: center;
    color: #666;
    margin-top: 25px;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="wrap">

    <div class="box">

        <h1>QuickEarn Hub</h1>

        <div class="welcome">
            Welcome! Test your knowledge.
        </div>

        <div id="quizBox">

            <div id="questionNumber">
                Question 1 of 10
            </div>

            <div id="question">
                Loading question...
            </div>

            <div id="answers"></div>

            <div id="result"></div>

            <button id="nextBtn" onclick="nextQuestion()">
                Next Question
            </button>

        </div>

        <div id="scoreBox">

            <h2>Quiz Complete 🎉</h2>

            <div class="score" id="finalScore"></div>

            <button id="restartBtn" onclick="restartQuiz()">
                Play Again
            </button>

        </div>

    </div>

    <div class="footer">
        More quizzes and features can be added later.
    </div>

</div>

<script>

const questions = [

    {
        question: "What is 2 + 2?",
        answers: ["3", "4", "5"],
        correct: "4"
    },

    {
        question: "What is 5 + 3?",
        answers: ["7", "8", "9"],
        correct: "8"
    },

    {
        question: "Which planet is known as the Red Planet?",
        answers: ["Earth", "Mars", "Jupiter"],
        correct: "Mars"
    },

    {
        question: "How many days are there in a week?",
        answers: ["5", "7", "10"],
        correct: "7"
    },

    {
        question: "What is the capital of Bangladesh?",
        answers: ["Dhaka", "Chittagong", "Sylhet"],
        correct: "Dhaka"
    },

    {
        question: "Which language is mainly used to structure a webpage?",
        answers: ["HTML", "C", "SQL"],
        correct: "HTML"
    },

    {
        question: "What is 10 - 4?",
        answers: ["5", "6", "7"],
        correct: "6"
    },

    {
        question: "Which one is a programming language?",
        answers: ["Python", "Chrome", "Google"],
        correct: "Python"
    },

    {
        question: "How many months are there in one year?",
        answers: ["10", "11", "12"],
        correct: "12"
    },

    {
        question: "What is 3 × 3?",
        answers: ["6", "9", "12"],
        correct: "9"
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").textContent = q.question;

    document.getElementById("result").textContent = "";

    document.getElementById("nextBtn").style.display = "none";

    const answersDiv = document.getElementById("answers");

    answersDiv.innerHTML = "";

    q.answers.forEach(answer => {

        const button = document.createElement("button");

        button.textContent = answer;

        button.onclick = function() {
            checkAnswer(answer, button);
        };

        answersDiv.appendChild(button);

    });

}

function checkAnswer(answer, clickedButton) {

    if (answered) {
        return;
    }

    answered = true;

    const q = questions[currentQuestion];

    const buttons = document.querySelectorAll("#answers button");

    buttons.forEach(button => {
        button.disabled = true;
    });

    const result = document.getElementById("result");

    if (answer === q.correct) {

        score++;

        result.textContent = "Correct! 🎉";

        /*
        Monetag rewarded popup.
        The ad is shown after a correct answer.
        */

        if (typeof show_11557358 === "function") {

            show_11557358("pop")
            .then(() => {
                result.textContent = "Correct! 🎉";
            })
            .catch(() => {
                result.textContent = "Correct! 🎉";
            });

        }

    } else {

        result.textContent = "Wrong answer. Try again next question.";

    }

    document.getElementById("nextBtn").style.display = "block";

}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        document.getElementById("quizBox").style.display = "none";

        document.getElementById("scoreBox").style.display = "block";

        document.getElementById("finalScore").textContent =
            "Your Score: " + score + " / " + questions.length;

    } else {

        loadQuestion();

    }

}

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    document.getElementById("quizBox").style.display = "block";

    document.getElementById("scoreBox").style.display = "none";

    loadQuestion();

}

const tg = window.Telegram && window.Telegram.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

loadQuestion();

</script>

</body>
</html>
